<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Soil Detection and Next Crop Prediction | AI Soil Analysis</title>
    <meta name="description" content="Professional soil detection and crop recommendations for the next season, powered by Gemini AI." />
    <meta name="theme-color" content="#f5f5f0" />
    <style>
      #root-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5f5f0;
        font-family: serif;
        color: #3d2b1f;
        z-index: 9999;
      }
      .loader-icon {
        width: 40px;
        height: 40px;
        border: 3px solid #5A5A40;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="root-loader">
        <div class="loader-icon"></div>
        <p>Loading Soil Detection and Next Crop Prediction...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
